<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" fill="none">
  <!-- Exact user-provided logo shape, recolored to black with transparent background -->
  <defs>
    <mask id="logo-shape-mask" x="0" y="0" width="640" height="180" maskUnits="userSpaceOnUse" style="mask-type:luminance">
      <image
        href="/assets/strefex-logo-user-exact.png"
        x="0"
        y="0"
        width="640"
        height="180"
        preserveAspectRatio="xMidYMid meet"
      />
    </mask>
  </defs>
  <rect x="0" y="0" width="640" height="180" fill="#101828" mask="url(#logo-shape-mask)" />
</svg>
